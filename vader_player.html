<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vader — interactive flipbook</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #080d14; color: #f3f4ef;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  h1 { font-size: 1rem; font-weight: 600; color: #a8b5c5; margin: 12px 0 8px; letter-spacing: .04em; }
  .stage {
    width: min(92vw, 420px);
    aspect-ratio: 1080 / 1920;
    background: #000; border: 1px solid #2c3b4a; border-radius: 8px; overflow: hidden;
  }
  .stage img { width: 100%; height: 100%; display: block; image-rendering: auto; }
  .bar {
    width: min(92vw, 420px); display: flex; align-items: center; gap: 8px;
    margin: 10px 0 4px;
  }
  button {
    background: #101923; color: #f3f4ef; border: 1px solid #2c3b4a; border-radius: 6px;
    min-width: 44px; height: 40px; font-size: 16px; cursor: pointer;
  }
  button:hover { border-color: #ffad76; }
  input[type=range] { flex: 1; accent-color: #ffad76; height: 32px; }
  select {
    background: #101923; color: #f3f4ef; border: 1px solid #2c3b4a; border-radius: 6px;
    height: 40px; padding: 0 6px; font-size: 14px;
  }
  .time { font-variant-numeric: tabular-nums; color: #a8b5c5; font-size: 13px; min-width: 84px; text-align: right; }
  .hint { color: #5c6b7a; font-size: 12px; margin: 4px 0 16px; }
  .loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #080d14; color: #a8b5c5; font-size: 15px; z-index: 10;
  }
</style>
</head>
<body>
<div class="loading" id="loading">Loading frames…</div>
<h1>VADER — INTERACTIVE FLIPBOOK</h1>
<div class="stage"><img id="frame" alt="frame"></div>
<div class="bar">
  <button id="play" title="Play / pause (space)">▶</button>
  <button id="rev" title="Reverse">⏪</button>
  <input type="range" id="scrub" min="0" max="659" value="0" step="1">
  <select id="speed" title="Speed">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
  </select>
  <div class="time" id="time">0.00 / 22.00 s</div>
</div>
<div class="hint">space = play/pause · ← → = step · drag the bar to scrub · R = reverse</div>
<script>
const N = 660, FPS = 30;
const img = document.getElementById('frame');
const scrub = document.getElementById('scrub');
const playBtn = document.getElementById('play');
const revBtn = document.getElementById('rev');
const speedSel = document.getElementById('speed');
const timeEl = document.getElementById('time');
const loading = document.getElementById('loading');

let idx = 0, playing = false, dir = 1, last = 0, acc = 0;

function url(i) { return 'vader_frames/' + String(i).padStart(4, '0') + '.jpg'; }
function show(i) {
  idx = ((i % N) + N) % N;
  img.src = url(idx);
  scrub.value = idx;
  timeEl.textContent = (idx / FPS).toFixed(2) + ' / ' + (N / FPS).toFixed(2) + ' s';
}
function setPlaying(p) {
  playing = p;
  playBtn.textContent = p ? '⏸' : '▶';
  if (p) { last = performance.now(); acc = 0; requestAnimationFrame(tick); }
}
function tick(now) {
  if (!playing) return;
  acc += (now - last) * parseFloat(speedSel.value);
  last = now;
  const step = 1000 / FPS;
  while (acc >= step) { acc -= step; show(idx + dir); }
  requestAnimationFrame(tick);
}
playBtn.onclick = () => setPlaying(!playing);
revBtn.onclick = () => { dir = -dir; revBtn.textContent = dir < 0 ? '⏩' : '⏪'; };
scrub.oninput = () => { setPlaying(false); show(parseInt(scrub.value, 10)); };
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight') { setPlaying(false); show(idx + 1); }
  if (e.key === 'ArrowLeft') { setPlaying(false); show(idx - 1); }
  if (e.key === 'r' || e.key === 'R') revBtn.onclick();
});

// preload all frames in the background so scrubbing is instant
let pre = 0;
(function preload() {
  const im = new Image();
  im.onload = im.onerror = () => {
    pre++;
    if (pre >= N) { loading.style.display = 'none'; show(0); }
    else preload();
  };
  im.src = url(pre);
})();
</script>
</body>
</html>
